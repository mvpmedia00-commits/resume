<style>
/* Layout: full-bleed 3D canvas; brass HUD plates pinned to the corners; modal "contract card" panels centered over a smoked-glass scrim. Single dark world by design. */
:root {
  --night: #120d0a;      /* scrim + panel ground */
  --soot: #1e1712;       /* panel fill */
  --brass: #d6a54a;      /* primary accent */
  --brass-dim: #8a6a2e;
  --teal: #3fe0c5;       /* portal / XP glow */
  --ember: #ff6a3d;      /* danger, health */
  --parch: #efe2c4;      /* text */
  --parch-dim: #b6a689;
  --display: "Rye", "Georgia", serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--night); color: var(--parch); overflow: hidden; }
body { font-family: var(--body); font-size: 16px; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; background: var(--night); }
#hud { position: fixed; inset: 0; pointer-events: none; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
[hidden] { display: none !important; }
.plate { background: linear-gradient(180deg, rgba(40,30,22,.88), rgba(22,16,12,.88)); border: 1px solid var(--brass-dim); box-shadow: inset 0 1px 0 rgba(255,220,150,.15), 0 4px 18px rgba(0,0,0,.45); border-radius: 6px; }
#stats { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(300px, 46vw); padding: 10px 12px; display: grid; gap: 6px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.name { font-family: var(--display); font-size: 17px; color: var(--brass); letter-spacing: .02em; }
.lvl { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--parch-dim); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(214,165,74,.45); border-radius: 3px; overflow: hidden; }
.bar > i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(180deg, #ff8a5c, var(--ember)); transition: transform .15s; }
.bar.xp { height: 6px; } .bar.xp > i { background: linear-gradient(180deg, #8ff5e4, var(--teal)); }
.bar > b { position: absolute; inset: 0; font-size: 10px; line-height: 11px; text-align: center; font-weight: 600; color: #fff; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
#purse { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 8px 12px; display: flex; gap: 16px; font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe9a6, var(--brass) 55%, #7a5718); box-shadow: 0 0 0 2px rgba(214,165,74,.35); margin-right: 6px; vertical-align: -1px; }
.vial { display: inline-block; width: 10px; height: 15px; border-radius: 3px 3px 5px 5px; background: linear-gradient(180deg, #ffd7c9 0 25%, var(--ember) 25%); margin-right: 6px; vertical-align: -2px; }
#objective { position: absolute; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); text-align: center; padding: 6px 16px; max-width: min(460px, 60vw); }
#objective .area { font-family: var(--display); color: var(--brass); font-size: 15px; }
#objective .goal { font-size: 14px; color: var(--parch); }
#bossbar { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, 80vw); text-align: center; }
#bossbar .bname { font-family: var(--display); color: var(--ember); font-size: 18px; text-shadow: 0 2px 6px #000; margin-bottom: 4px; }
#bossbar .bar { height: 14px; }
#cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%); }
#cross::before, #cross::after { content: ""; position: absolute; background: rgba(255,240,200,.85); box-shadow: 0 0 2px #000; }
#cross::before { left: 10px; top: 0; width: 2px; height: 22px; } #cross::after { top: 10px; left: 0; height: 2px; width: 22px; }
#cross i { position: absolute; inset: 7px; border: 1px solid rgba(63,224,197,.9); border-radius: 50%; }
#prompt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); padding: 6px 14px; font-weight: 600; letter-spacing: .03em; }
#prompt kbd, .keys kbd { font-family: var(--body); display: inline-block; min-width: 1.6em; padding: 0 .4em; margin-right: 6px; border: 1px solid var(--brass); border-radius: 4px; color: var(--brass); text-align: center; }
#hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: var(--parch-dim); line-height: 1.6; padding: 8px 12px; transition: opacity 1s; }
#tonicCd { font-size: 12px; color: var(--parch-dim); }
#banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; font-family: var(--display); font-size: clamp(28px, 6vw, 56px); color: var(--brass); text-shadow: 0 3px 0 #3b2a10, 0 8px 30px rgba(0,0,0,.8); opacity: 0; transition: opacity .4s; padding-inline: 16px; text-wrap: balance; }
#banner small { display: block; font-family: var(--body); font-size: clamp(14px, 2.4vw, 20px); color: var(--parch); letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 2px 6px #000; }
#banner.on { opacity: 1; }
#hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px 40px rgba(255,60,30,.65); opacity: 0; transition: opacity .25s; }
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.num { position: absolute; font-weight: 700; font-size: 18px; color: #fff3cf; text-shadow: 0 2px 0 #000, 0 0 6px #000; transform: translate(-50%,-50%); white-space: nowrap; }
.num.crit { color: var(--brass); font-size: 24px; } .num.xp { color: var(--teal); font-size: 15px; } .num.bad { color: var(--ember); }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; pointer-events: none; width: min(300px, 70vw); }
.toast { padding: 8px 12px; animation: tin .3s ease-out; }
.toast b { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--teal); }
@keyframes tin { from { transform: translateX(30px); opacity: 0; } }
/* Panels */
#scrim { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(18,13,10,.55), rgba(10,7,5,.9)); padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
#scrim.clear { background: linear-gradient(180deg, rgba(10,7,5,0) 40%, rgba(10,7,5,.85)); }
.panel { width: min(520px, 100%); padding: 22px 22px 20px; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--brass); font-size: 26px; text-wrap: balance; }
.panel h3 { margin: 0; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--teal); font-weight: 600; }
.panel p { margin: 0; line-height: 1.5; color: var(--parch); max-width: 60ch; }
.panel .muted { color: var(--parch-dim); font-size: 14px; }
.btns { display: grid; gap: 8px; }
.btn { pointer-events: auto; font: 600 16px/1.2 var(--body); letter-spacing: .04em; color: var(--parch); background: linear-gradient(180deg, #3a2b1d, #261b12); border: 1px solid var(--brass-dim); border-radius: 5px; padding: 10px 14px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.btn:hover, .btn:focus-visible { border-color: var(--brass); background: linear-gradient(180deg, #4a3622, #2e2015); outline: none; box-shadow: 0 0 0 2px rgba(214,165,74,.35); }
.btn.primary { background: linear-gradient(180deg, #e2b75e, #a77a2b); color: #23170a; border-color: #f2d28a; }
.btn.primary:hover, .btn.primary:focus-visible { background: linear-gradient(180deg, #f0c86e, #b98a35); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn small { font-weight: 500; color: var(--parch-dim); font-size: 13px; }
.btn.primary small { color: #3b2a12; }
.title { text-align: center; display: grid; gap: 6px; padding-bottom: 6px; }
.title .eyebrow { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--teal); }
.title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(36px, 8vw, 58px); line-height: 1; color: var(--brass); text-shadow: 0 3px 0 #4a3412, 0 10px 30px rgba(0,0,0,.7); text-wrap: balance; }
.title .sub { font-size: 15px; color: var(--parch-dim); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; align-items: center; }
.keys span { color: var(--parch-dim); }
label.set { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 10px; align-items: center; font-size: 15px; }
label.set output { font-variant-numeric: tabular-nums; color: var(--brass); width: 3.5em; text-align: right; }
input[type=range] { accent-color: var(--brass); width: 100%; pointer-events: auto; }
.speaker { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; }
.badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 22px; color: #23170a; background: radial-gradient(circle at 35% 30%, #ffe6a3, var(--brass) 60%, #6e4f19); border: 2px solid #f2d28a; }
.badge.teal { background: radial-gradient(circle at 35% 30%, #c9fff5, var(--teal) 60%, #1b6d60); border-color: #a8f7ea; }
.reward { font-size: 14px; color: var(--brass); font-weight: 600; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.ach div { font-size: 13px; padding: 6px 8px; border: 1px solid rgba(214,165,74,.3); border-radius: 4px; color: var(--parch-dim); }
.ach div.got { color: var(--parch); border-color: var(--brass); background: rgba(214,165,74,.12); }
@media (max-width: 640px) {
  #objective { top: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  #hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } #banner, #hurt { transition: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   GOLD GEAR HUNTER — browser prototype
   Structure mirrors the planned Godot 4 project so it ports cleanly:
   DATA tables  -> Godot Resources (.tres)
   Platform     -> GodotSteam autoload (achievements, cloud saves)
   save object  -> user:// save file / Steam Cloud
   ===================================================================== */

// ---------------------------------------------------------------- DATA
const ENEMY = {
  bot:   { name: 'Steam-bot',  hp: 38, dmg: 14, speed: 3.4, r: 0.75, xp: 12, coins: [3, 6] },
  drone: { name: 'Gear Drone', hp: 24, dmg: 10, speed: 4.4, r: 0.6,  xp: 14, coins: [4, 7], fly: true },
  ram:   { name: 'Boiler Ram', hp: 64, dmg: 22, speed: 2.6, r: 1.0,  xp: 22, coins: [6, 10] },
};
const BOSS = {
  golem:   { name: 'The Foundry Golem',   hp: 900,  dmg: 26, speed: 2.4, r: 2.0, xp: 220, coins: 140, add: 'bot',
             pattern: ['slam', 'quake', 'slam', 'summon'], p2: ['burst', 'slam', 'quake', 'summon'] },
  admiral: { name: 'Drone Admiral Vex',   hp: 1400, dmg: 24, speed: 3.6, r: 1.8, xp: 360, coins: 220, add: 'drone', fly: true,
             pattern: ['burst', 'barrage', 'burst', 'summon'], p2: ['barrage', 'burst', 'barrage', 'summon'] },
  warden:  { name: 'The Clockwork Warden', hp: 2300, dmg: 30, speed: 2.8, r: 2.1, xp: 520, coins: 320, add: 'ram',
             pattern: ['charge', 'quake', 'burst', 'charge', 'summon'], p2: ['charge', 'barrage', 'charge', 'quake', 'summon'] },
};
const AREAS = [
  { id: 'foundry', name: 'Runaway Foundry', mul: 1, boss: 'golem',
    floor: ['#5e4532', '#20150e'], grout: '#ff6a2a', sky: 0x3a2214, fog: 0x3a2214, hemi: [0xffb27a, 0x2a1a10], accent: 0xff7a2a,
    waves: [{ bot: 4 }, { bot: 4, drone: 2 }, { bot: 5, drone: 3 }],
    quest: { title: 'Scrap the Foundry Golem',
      brief: 'The smelters on Ash Row woke up on their own last night. Whatever is running that furnace calls itself a Golem now. Go through the gate, scrap its bots, and bring me its core.',
      reward: { coins: 150, xp: 150 } } },
  { id: 'skydock', name: 'Sky-Dock Nine', mul: 1.7, boss: 'admiral',
    floor: ['#6b4b2f', '#2b1d12'], grout: '#3fe0c5', sky: 0x4a6a86, fog: 0x7c8ea0, hemi: [0xcfe4ff, 0x4a3a2a], accent: 0x3fe0c5,
    waves: [{ drone: 4 }, { drone: 4, bot: 3 }, { drone: 6, bot: 3 }],
    quest: { title: 'Ground the Drone Admiral',
      brief: 'Somebody wired the dock drones into a fleet and gave it a captain. Admiral Vex is grounding every airship in the valley. Clip its wings.',
      reward: { coins: 260, xp: 280 } } },
  { id: 'vault', name: 'Clockwork Vault', mul: 2.5, boss: 'warden',
    floor: ['#2e3b3a', '#121918'], grout: '#d6a54a', sky: 0x0d1414, fog: 0x0f1a1a, hemi: [0x9fe8dc, 0x1a1410], accent: 0xd6a54a,
    waves: [{ bot: 4, ram: 1 }, { ram: 2, drone: 3 }, { ram: 3, bot: 3, drone: 3 }],
    quest: { title: 'Stop the Clockwork Warden',
      brief: 'Every machine we scrapped was built from parts out of the old Guild vault. The Warden down there is still building. This is the big one, hunter.',
      reward: { coins: 400, xp: 450 } } },
];
const UPGRADES = [
  { id: 'dmg',   name: 'Rifled Barrel', desc: '+4 pistol damage',  base: 60, max: 8 },
  { id: 'rate',  name: 'Spring Hammer', desc: '12% faster firing', base: 70, max: 6 },
  { id: 'hp',    name: 'Brass Plating', desc: '+25 max health',    base: 50, max: 8 },
  { id: 'speed', name: 'Piston Boots',  desc: '+7% move speed',    base: 40, max: 5 },
];
const TONIC = { cost: 25, max: 5, heal: 0.45, cooldown: 2 };
const ACH = { // mirrors Steamworks achievement API names
  FIRST_SCRAP:  'First Scrap: destroy a machine',
  GOLEM_DOWN:   'Furnace Out: beat the Foundry Golem',
  ADMIRAL_DOWN: 'Grounded: beat Drone Admiral Vex',
  WARDEN_DOWN:  'Vault Breaker: beat the Clockwork Warden',
  NIMBLE:       'Nimble: dodge 25 attacks with a roll',
  FULL_PURSE:   'Full Purse: hold 500 coins',
  LEVEL_10:     'Seasoned Hunter: reach level 10',
  TINKERER:     'Tinkerer: buy 10 upgrades',
};

// ---------------------------------------------------------------- SAVE
const SAVE_KEY = 'ggh_save_v1';
function freshSave() {
  return { v: 1, started: false, level: 1, xp: 0, coins: 0, tonics: 2,
    up: { dmg: 0, rate: 0, hp: 0, speed: 0 },
    quests: { foundry: 'available', skydock: 'locked', vault: 'locked' },
    ach: [], stats: { kills: 0, dodges: 0, bosses: 0, bought: 0 },
    settings: { sens: 1, vol: 0.6, shake: 1 } };
}
let save = freshSave();
function mergeSave(d) {
  const f = freshSave();
  save = Object.assign(f, d);
  save.up = Object.assign(f.up, d.up || {});
  save.quests = Object.assign(freshSave().quests, d.quests || {});
  save.stats = Object.assign(freshSave().stats, d.stats || {});
  save.settings = Object.assign(freshSave().settings, d.settings || {});
  save.ach = Array.isArray(d.ach) ? d.ach : [];
}
function loadSave() { try { const r = localStorage.getItem(SAVE_KEY); if (r) mergeSave(JSON.parse(r)); } catch (e) {} }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const stat = {
  dmg: () => 10 + 2 * (save.level - 1) + 4 * save.up.dmg,
  rate: () => 0.3 * Math.pow(0.88, save.up.rate),
  maxHp: () => 100 + 10 * (save.level - 1) + 25 * save.up.hp,
  speed: () => 6.4 * (1 + 0.07 * save.up.speed),
  xpNeed: () => Math.round(60 * Math.pow(save.level, 1.45)),
};
const upCost = u => Math.round(u.base * Math.pow(1.6, save.up[u.id]));

// Platform layer: swap this object for GodotSteam calls in the Steam build.
const Platform = {
  unlock(id) {
    if (save.ach.includes(id)) return;
    save.ach.push(id); persist();
    toast('Achievement', ACH[id].split(':')[0]);
    sfx('level');
  },
};

// ---------------------------------------------------------------- UTIL
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------------------------------------------------------------- AUDIO (synthesized, no files)
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = save.settings.vol; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'square', vol = 0.15, slide = 0, delay = 0) {
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq = 1200, delay = 0, type = 'lowpass') {
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {
  shoot() { noise(0.09, 0.35, 3000); tone(420, 0.08, 'square', 0.06, -250); },
  hit() { tone(900, 0.05, 'square', 0.05, -400); },
  crit() { tone(1300, 0.08, 'triangle', 0.09, -600); },
  scrap() { noise(0.35, 0.3, 700); tone(160, 0.3, 'sawtooth', 0.08, -100); },
  coin() { tone(1180, 0.07, 'sine', 0.08); tone(1580, 0.1, 'sine', 0.07, 0, 0.06); },
  roll() { noise(0.22, 0.18, 900, 0, 'bandpass'); },
  hurt() { tone(220, 0.2, 'sawtooth', 0.12, -120); noise(0.15, 0.2, 500); },
  slam() { noise(0.5, 0.5, 260); tone(70, 0.45, 'sine', 0.3, -30); },
  zap() { tone(700, 0.18, 'sawtooth', 0.05, 500); },
  warn() { tone(300, 0.12, 'triangle', 0.06, 200); },
  level() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.1, 0, i * 0.08)); },
  portal() { tone(300, 0.6, 'sine', 0.12, 600); noise(0.6, 0.12, 2000, 0, 'bandpass'); },
  click() { tone(660, 0.04, 'square', 0.04); },
  buy() { tone(880, 0.06, 'square', 0.06); tone(1320, 0.1, 'square', 0.05, 0, 0.06); },

    Object.assign(parts, { armL, armR });
  } else if (type === 'drone' || type === 'admiral') {
    g.add(mesh(G.sph(0.5, 16), hull, 0, 0, 0));
    const ring = mesh(new THREE.TorusGeometry(0.75, 0.07, 8, 24), M.brass, 0, 0, 0); ring.rotation.x = Math.PI / 2; g.add(ring);
    g.add(mesh(G.sph(0.18, 12), eye, 0, 0, 0.42, false));
    const p1 = mesh(G.box(1.1, 0.03, 0.14), M.dark, 0, 0.45, 0), p2 = p1.clone();
    p2.rotation.y = Math.PI / 2;
    const prop = new THREE.Group(); prop.add(p1, p2); g.add(prop, mesh(G.cyl(0.04, 0.04, 0.3, 6), M.dark, 0, 0.3, 0));
    if (type === 'admiral') {

      const r2 = mesh(new THREE.TorusGeometry(1.0, 0.05, 8, 28), M.copper, 0, -0.1, 0); r2.rotation.x = Math.PI / 2; g.add(r2);
      for (let i = 0; i < 4; i++) { const a = i * TAU / 4; g.add(mesh(G.cyl(0.12, 0.08, 0.5, 8), M.brass, Math.cos(a) * 0.9, -0.2, Math.sin(a) * 0.9)); }
    }

    const barrel = mesh(G.cyl(0.6, 0.6, 1.6, 16), hull, 0, 0.95, 0); barrel.rotation.x = Math.PI / 2; g.add(barrel);
    for (const z of [-0.6, 0, 0.6]) { const b = mesh(G.cyl(0.63, 0.63, 0.1, 16), M.brass, 0, 0.95, z); b.rotation.x = Math.PI / 2; g.add(b); }
    const horn = mesh(new THREE.ConeGeometry(0.45, 0.8, 12), M.copper, 0, 0.95, 1.15); horn.rotation.x = Math.PI / 2; g.add(horn);
    g.add(mesh(G.cyl(0.14, 0.18, 0.7, 10), M.dark, 0, 1.75, -0.4));
    g.add(mesh(G.box(0.5, 0.12, 0.05), eye, 0, 1.3, 0.62, false));
    for (const x of [-0.55, 0.55]) for (const z of [-0.5, 0.5]) {
      const w = mesh(G.cyl(0.3, 0.3, 0.15, 12), M.dark, x, 0.3, z); w.rotation.z = Math.PI / 2; g.add(w);
    }
    if (type === 'warden') {

    }
  }
  g.scale.setScalar(scale);

}

// Procedural floor textures
function floorTexture(base, dark, grout, tiles = 8, rivets = true) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = dark; x.fillRect(0, 0, 512, 512);
  const s = 512 / tiles;
  for (let i = 0; i < tiles; i++) for (let j = 0; j < tiles; j++) {
    const off = (j % 2) * s * 0.5, v = rand(-14, 14);
    const col = new THREE.Color(base); col.offsetHSL(0, 0, v / 255);
    x.fillStyle = '#' + col.getHexString();
    x.fillRect(i * s + off + 3, j * s + 3, s - 6, s - 6);
    x.fillRect(i * s + off + 3 - 512, j * s + 3, s - 6, s - 6);
    if (rivets) { x.fillStyle = 'rgba(255,220,160,.25)'; x.beginPath(); x.arc(i * s + off + 10, j * s + 10, 3, 0, TAU); x.fill(); }
  }
  if (grout) { x.globalAlpha = 0.18; x.strokeStyle = grout; x.lineWidth = 2;
    for (let i = 0; i <= tiles; i++) { x.beginPath(); x.moveTo(0, i * s); x.lineTo(512, i * s); x.stroke(); } x.globalAlpha = 1; }
  for (let k = 0; k < 1800; k++) { x.fillStyle = `rgba(0,0,0,${rand(0.02, 0.1)})`; x.fillRect(rand(0, 512), rand(0, 512), 2, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}

function removeObj(e) { const o = e.g || e.mesh; if (o && o.parent) o.parent.remove(o); }

function addBox(x, z, w, d) { solids.push({ box: true, minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 }); }
function addCircle(x, z, r) { solids.push({ box: false, x, z, r }); }

function resolve(p, r) {
  for (const s of solids) {
    if (s.box) {
      const cx = clamp(p.x, s.minX, s.maxX), cz = clamp(p.z, s.minZ, s.maxZ);
      let dx = p.x - cx, dz = p.z - cz; const d2 = dx * dx + dz * dz;
      if (d2 < r * r) {
        if (d2 > 1e-6) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
        else { // inside: push out on shallowest axis
          const o = [p.x - s.minX + r, s.maxX - p.x + r, p.z - s.minZ + r, s.maxZ - p.z + r], m = Math.min(...o);
          if (m === o[0]) p.x = s.minX - r; else if (m === o[1]) p.x = s.maxX + r; else if (m === o[2]) p.z = s.minZ - r; else p.z = s.maxZ + r;
        }
      }
    } else {
      const dx = p.x - s.x, dz = p.z - s.z, d = Math.hypot(dx, dz), m = r + s.r;
      if (d < m && d > 1e-6) { p.x = s.x + dx / d * m; p.z = s.z + dz / d * m; }
    }
  }
  p.x = clamp(p.x, bounds.minX + r, bounds.maxX - r); p.z = clamp(p.z, bounds.minZ + r, bounds.maxZ - r);
}

function nextWave() {
  const A = AREAS[S.area];
  S.waveIdx++;
  if (S.waveIdx < A.waves.length) {
    banner('Wave ' + (S.waveIdx + 1) + ' / ' + A.waves.length);
    const w = A.waves[S.waveIdx]; let i = 0;
    for (const type in w) for (let k = 0; k < w[type]; k++) { const d = i++ * 0.35; after(0.6 + d, () => spawnWithPortal(type, edgePoint())); S.pending++; }
    S.waveLive = true;
  } else {
    S.waveLive = false;
    banner(BOSS[A.boss].name, 'The boss awakens'); sfx('boss');
    after(2.4, () => spawnBoss(A.boss));
  }
  updateGoal();
}
function edgePoint() {
  for (let tries = 0; tries < 20; tries++) {
    const a = rand(0, TAU), r = rand(14, 21), x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x - P.pos.x, z - P.pos.z) > 9) return { x: clamp(x, -21, 21), z: clamp(z, -21, 21) };
  }
  return { x: 0, z: -18 };
}
function spawnWithPortal(type, p) {
  telegraph({ shape: 'circle', x: p.x, z: p.z, r: 1.3, dur: 0.9, color: 0x3fe0c5, onDone: () => { S.pending = Math.max(0, S.pending - 1); spawnEnemy(type, p.x, p.z); burst(p.x, 1, p.z, 0x3fe0c5, 12); } });
}

function spawnBoss(id) {

  const scale = id === 'golem' ? 2.4 : id === 'admiral' ? 2.6 : 2.0;

function faceTo(e, x, z, rate, dt) {
  const target = Math.atan2(x - e.pos.x, z - e.pos.z);
  let d = target - e.g.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
  e.g.rotation.y += d * Math.min(1, rate * dt);
}
function moveEnemy(e, dx, dz, speed, dt) {
  const len = Math.hypot(dx, dz) || 1;
  e.pos.x += dx / len * speed * dt; e.pos.z += dz / len * speed * dt;
  const y = e.pos.y; resolve(e.pos, e.r); e.pos.y = y;
}
function updEnemy(e, dt) {
  const dx = P.pos.x - e.pos.x, dz = P.pos.z - e.pos.z, d = Math.hypot(dx, dz);
  e.cd -= dt; e.t -= dt; e.bob += dt;
  if (e.type === 'bot') {
    if (e.state === 'chase') {
      faceTo(e, P.pos.x, P.pos.z, 8, dt);
      if (d > 1.7) moveEnemy(e, dx, dz, e.def.speed, dt);
      e.pt.armL.rotation.x = Math.sin(e.bob * 8) * 0.5; e.pt.armR.rotation.x = -Math.sin(e.bob * 8) * 0.5;
      if (d < 2.6 && e.cd <= 0) {
        e.state = 'wind'; e.t = 0.75;
        const fx = Math.sin(e.g.rotation.y), fz = Math.cos(e.g.rotation.y);
        telegraph({ shape: 'circle', x: e.pos.x + fx * 1.3, z: e.pos.z + fz * 1.3, r: 1.8, dur: 0.75, dmg: e.dmg, src: e, onDone: () => { S.shake = Math.max(S.shake, 0.15); sfx('slam'); } });
      }
    } else if (e.state === 'wind') {
      e.pt.armL.rotation.x = e.pt.armR.rotation.x = lerp(e.pt.armL.rotation.x, -2.6, dt * 6);
      if (e.t <= 0) { e.state = 'recover'; e.t = 0.6; e.pt.armL.rotation.x = e.pt.armR.rotation.x = -0.3; }
    } else if (e.t <= 0) { e.state = 'chase'; e.cd = rand(1, 1.6); }
  } else if (e.type === 'drone') {
    e.pos.y = 2.2 + Math.sin(e.bob * 2.4) * 0.25; e.pt.prop.rotation.y += dt * 30;
    faceTo(e, P.pos.x, P.pos.z, 6, dt);
    if (e.state === 'chase') {
      let mx = 0, mz = 0;
      if (d > 11) { mx = dx; mz = dz; } else if (d < 7) { mx = -dx; mz = -dz; }
      const sx = -dz / (d || 1) * e.strafe, sz = dx / (d || 1) * e.strafe;
      mx = mx / (d || 1) + sx * 0.7; mz = mz / (d || 1) + sz * 0.7;
      moveEnemy(e, mx, mz, e.def.speed, dt);
      if (Math.random() < dt * 0.3) e.strafe *= -1;
      if (e.cd <= 0 && d < 18) { e.state = 'wind'; e.t = 0.55; sfx('warn'); }
    } else if (e.state === 'wind') {
      e.pt.eye.color.setHex(Math.sin(S.t * 40) > 0 ? 0xffffff : 0xff7a2a);
      if (e.t <= 0) { e.pt.eye.color.setHex(0xff7a2a); fireOrb(e, Math.atan2(dx, dz), 10, e.dmg); e.state = 'chase'; e.cd = rand(1.8, 2.6); }
    }
  } else if (e.type === 'ram') {
    if (e.state === 'chase') {
      faceTo(e, P.pos.x, P.pos.z, 4, dt);
      if (d > 3) moveEnemy(e, dx, dz, e.def.speed, dt);
      if (d < 13 && e.cd <= 0) startCharge(e, 14, 2.2, 0.9, 15);
    } else if (e.state === 'dash') updDash(e, dt);

}
function startCharge(e, len, w, dur, speed) {

}
function updDash(e, dt) {
  const D = e.dash; if (!D) { e.state = 'recover'; return; }

  moveEnemy(e, D.dx, D.dz, D.speed, dt); D.left -= dt;
  if (Math.random() < 0.6) puff(e.pos.x, 0.4, e.pos.z, 0x8a7d6c);
  if (!D.hit && Math.hypot(P.pos.x - e.pos.x, P.pos.z - e.pos.z) < e.r * (e.boss ? 1.2 : 1) + 0.5) { D.hit = true; hurtPlayer(e.dmg, e); }
  const stuck = Math.hypot(e.pos.x - px, e.pos.z - pz) < D.speed * dt * 0.3;
  if (D.left <= 0 || stuck) { e.dash = null; e.state = 'recover'; e.t = e.boss ? 0.6 : 1; if (stuck) { S.shake = Math.max(S.shake, 0.3); sfx('slam'); } }
}
function fireOrb(e, angle, speed, dmg, y) {
  const m = new THREE.Mesh(G.sph(0.28, 10), new THREE.MeshBasicMaterial({ color: 0xff8a3a }));
  m.position.set(e.pos.x + Math.sin(angle) * e.r, y ?? Math.max(1.1, e.pos.y), e.pos.z + Math.cos(angle) * e.r);
  level.add(m);
  orbs.push({ mesh: m, vx: Math.sin(angle) * speed, vz: Math.cos(angle) * speed, life: 4, dmg });
  sfx('zap');
}

// Bosses run a repeating attack pattern; below 50% health they switch to a faster phase-two pattern.
function updBoss(e, dt) {
  const def = e.def, dx = P.pos.x - e.pos.x, dz = P.pos.z - e.pos.z, d = Math.hypot(dx, dz);
  e.bob += dt;
  if (def.fly) { e.pos.y = 3.4 + Math.sin(e.bob * 1.6) * 0.4; e.pt.prop.rotation.y += dt * 20; }
  if (e.pt.gear) e.pt.gear.rotation.z += dt * (e.phase2 ? 3 : 1.2);
  if (!e.phase2 && e.hp < e.maxHp * 0.5) {
    e.phase2 = true; e.step = 0; banner('Phase two', def.name + ' overheats'); sfx('boss'); S.shake = 0.5;
    e.pt.eye.color.setHex(0xff2a1a);
  }
  if (e.state === 'dash') { updDash(e, dt); return; }
  if (e.busy > 0) { e.busy -= dt; if (e.state !== 'jump') faceTo(e, P.pos.x, P.pos.z, 2, dt); return; }
  faceTo(e, P.pos.x, P.pos.z, 4, dt);
  if (d > (def.fly ? 9 : 5)) moveEnemy(e, dx, dz, def.speed * (e.phase2 ? 1.25 : 1), dt);
  else if (def.fly && d < 6) moveEnemy(e, -dx, -dz, def.speed, dt);
  e.cd -= dt;
  if (e.cd > 0) return;
  const pat = e.phase2 ? def.p2 : def.pattern, atk = pat[e.step++ % pat.length];
  e.cd = e.phase2 ? 0.9 : 1.4;
  const P2 = e.phase2;
  if (atk === 'slam') {
    telegraph({ shape: 'circle', x: P.pos.x, z: P.pos.z, r: P2 ? 3.6 : 3.2, dur: P2 ? 0.85 : 1.05, dmg: e.dmg, src: e, onDone: () => { S.shake = 0.45; sfx('slam'); } });
    e.busy = 1.1; sfx('warn');
  } else if (atk === 'quake') {
    telegraph({ shape: 'circle', x: e.pos.x, z: e.pos.z, r: 7.5, dur: P2 ? 1.0 : 1.3, dmg: Math.round(e.dmg * 1.2), src: e, onDone: () => { S.shake = 0.7; sfx('slam'); ringFx(e.pos.x, e.pos.z, 7.5); } });

// Every enemy hit is announced on the ground first. Roll through it (i-frames) or step out.
function telegraph(o) {

  const fillMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.32, depthWrite: false, side: THREE.DoubleSide });
  let fill;

    const ring = new THREE.Mesh(new THREE.RingGeometry(o.r * 0.93, o.r, 48), outlineMat); ring.rotation.x = -Math.PI / 2; g.add(ring);
    fill = new THREE.Mesh(new THREE.CircleGeometry(o.r, 48), fillMat); fill.rotation.x = -Math.PI / 2; fill.scale.setScalar(0.01); g.add(fill);
  } else {

}

  const btn = i => gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.4);
  const edge = i => { const now = btn(i), was = padPrev[i]; padPrev[i] = now; return now && !was; };
  const st = { mx: dz(gp.axes[0] || 0), my: dz(gp.axes[1] || 0), fire: btn(7) || btn(5), roll: edge(0), act: edge(2), tonic: edge(3), pause: edge(9), up: edge(12), down: edge(13), b: edge(1) };
  if (S.mode === 'play') {

  } else if (S.mode === 'menu') {
    const list = [...document.querySelectorAll('#scrim button:not([disabled])')];
    if (list.length) {
      let i = list.indexOf(document.activeElement);
      if (st.down || st.my > 0.6 && !padPrev.stickDown) list[(i + 1) % list.length].focus();
      if (st.up || st.my < -0.6 && !padPrev.stickUp) list[(i - 1 + list.length) % list.length].focus();
      if (st.roll && i >= 0) list[i].click();

    retreat: () => { closePanel(); fade(() => buildTown()); },
    quit: () => { persist(); clearLevel(); buildTown(); S.mode = 'title'; openTitle(); },
    revive: () => { P.hp = stat.maxHp(); closePanel(); fade(() => buildTown()); },
    buy: () => buyUpgrade(arg),
    tonic: () => { if (save.coins >= TONIC.cost && save.tonics < TONIC.max) { save.coins -= TONIC.cost; save.tonics++; sfx('buy'); persist(); } openShop(); },
    accept: () => { save.quests[arg] = 'active'; persist(); sfx('level'); toast('Contract taken', AREAS.find(a => a.id === arg).quest.title); closePanel(); updateGoal(); },
    turnin: () => turnIn(arg),

scrim.addEventListener('input', e => {

  if (t.id === 'shake') save.settings.shake = +t.value;
  const out = scrim.querySelector(`output[for=${t.id}]`); if (out) out.textContent = Math.round(t.value * 100) + '%';

});

function buyUpgrade(id) {

}
function currentQuestArea() {

}

function turnIn(id) {
  const ai = AREAS.findIndex(a => a.id === id), A = AREAS[ai];
  if (save.quests[id] !== 'ready') return;
  save.quests[id] = 'done'; save.coins += A.quest.reward.coins; gainXp(A.quest.reward.xp);

  if (save.coins >= 500) Platform.unlock('FULL_PURSE');
  sfx('coin'); persist(); closePanel(); updateGoal();
  if (ai === AREAS.length - 1) banner('Chapter One complete', 'Thanks for playing the prototype');
}
function openPortal() {
  S.mode = 'menu'; exitLock();

  }).join('');
  showPanel(`<div class="panel plate"><h3>The teal gate</h3><h2>Choose a destination</h2>

function toast(title, text) {
  const el = document.createElement('div'); el.className = 'toast plate'; el.innerHTML = `<b>${esc(title)}</b>${esc(text)}`;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200);
}
let bannerTimer = 0;
function banner(main, sub = '') {
  const b = $('#banner'); b.innerHTML = esc(main) + (sub ? `<small>${esc(sub)}</small>` : ''); b.classList.add('on');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => b.classList.remove('on'), 2200);
}
function fade(fn) { fn(); } // scene swap hook (Godot: AnimationPlayer fade)

function updateGoal() {
  const g = $('#goal');

    const i = currentQuestArea();
    if (i < 0) g.textContent = 'Chapter One complete · replay areas from the gate';
    else {
      const A = AREAS[i], st = save.quests[A.id];

    }

  } else {

  }
}
function updateHud() {
  const max = stat.maxHp();
  $('#hpFill').style.transform = `scaleX(${clamp(P.hp / max, 0, 1)})`;
  $('#hpText').textContent = `${Math.ceil(P.hp)} / ${max}`;
  $('#xpFill').style.transform = `scaleX(${clamp(save.xp / stat.xpNeed(), 0, 1)})`;
  $('#lvl').textContent = 'Lv ' + save.level;

}

function startPlay(isNew) {
  S.mode = 'play'; closePanel(); $('#hud').hidden = false;
  buildTown(); P.hp = stat.maxHp();

// ---------------------------------------------------------------- MAIN LOOP
const clock = new THREE.Clock();
let hudTick = 0, autosave = 0;
const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); S.t += dt;
  const pad = pollPad(dt);
  for (const s of spinners) s.o.rotation[s.axis] += s.s * dt;
  for (const b of bobbers) b.o.position.y = b.y + Math.sin(S.t * (b.sp || 2)) * (b.amp || 0.15);
  if (portalFx) portalFx.disc.material.opacity = 0.45 + Math.sin(S.t * 3) * 0.12;
  if (S.mode === 'play') update(dt, pad);
  else if (S.mode === 'title') {
    const a = S.t * 0.08; camera.position.set(Math.sin(a) * 26, 11, Math.cos(a) * 26 - 2); camera.lookAt(0, 2, -4);
    P.model.g.position.copy(P.pos); P.model.g.rotation.y = Math.PI;
  }
  pressed.clear();
  updNums(dt);
  renderer.render(scene, camera);
}
function update(dt, pad) {
  // timers
  for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; if (t.gen !== S.gen) { timers.splice(i, 1); continue; } t.t -= dt; if (t.t <= 0) { timers.splice(i, 1); t.fn(); } }
  if (S.mode !== 'play') return;
  // camera turn by keys
  if (keys.has('ArrowLeft')) P.yaw += 2.2 * dt; if (keys.has('ArrowRight')) P.yaw -= 2.2 * dt;
  // movement
  let ix = 0, iz = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iz += 1; if (keys.has('KeyS') || keys.has('ArrowDown')) iz -= 1;
  if (keys.has('KeyD')) ix += 1; if (keys.has('KeyA')) ix -= 1;
  if (pad) { ix += pad.mx; iz -= pad.my; }
  const il = Math.hypot(ix, iz); if (il > 1) { ix /= il; iz /= il; }
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
  const wx = fx * iz + rx * ix, wz = fz * iz + rz * ix;
  P.rollCd -= dt; P.inv -= dt; P.fireCd -= dt; P.tonicCd -= dt;
  if ((pressed.has('Space') || pressed.has('ShiftLeft') || (pad && pad.roll)) && P.rollCd <= 0 && P.roll <= 0) {
    const l = Math.hypot(wx, wz);
    P.rollDir.set(l > 0.1 ? wx / l : fx, 0, l > 0.1 ? wz / l : fz); P.roll = 0.38; P.rollCd = 0.75; sfx('roll');
  }
  const speed = stat.speed();
  if (P.roll > 0) {
    P.roll -= dt; P.vel.set(P.rollDir.x * 15, 0, P.rollDir.z * 15);
    if (Math.random() < 0.5) puff(P.pos.x, 0.3, P.pos.z, 0x9a8a72);
  } else {
    P.vel.x = lerp(P.vel.x, wx * speed, Math.min(1, dt * 14)); P.vel.z = lerp(P.vel.z, wz * speed, Math.min(1, dt * 14));
  }
  P.pos.x += P.vel.x * dt; P.pos.z += P.vel.z * dt; resolve(P.pos, 0.45);
  // fire
  const firing = mouse.left || keys.has('KeyJ') || (pad && pad.fire);
  if (firing && P.fireCd <= 0 && P.roll <= 0) { shoot(); P.fireCd = stat.rate(); }
  if (pressed.has('KeyQ') || (pad && pad.tonic)) useTonic();
  // model pose
  const m = P.model, moving = Math.hypot(P.vel.x, P.vel.z) > 0.5;
  m.g.position.copy(P.pos);
  m.g.rotation.y = Math.atan2(fx, fz);
  P.walk += dt * (moving ? 11 : 0);
  m.legL.rotation.x = Math.sin(P.walk) * 0.6 * (moving ? 1 : 0); m.legR.rotation.x = -m.legL.rotation.x;
  m.armL.rotation.x = -m.legL.rotation.x * 0.7;
  if (P.roll > 0) { m.g.rotation.x = 0; m.g.position.y = Math.sin((0.38 - P.roll) / 0.38 * Math.PI) * 0.35; m.g.scale.y = 0.75; }
  else { m.g.position.y = moving ? Math.abs(Math.sin(P.walk)) * 0.06 : 0; m.g.scale.y = 1; }
  m.g.visible = !(P.inv > 0 && Math.sin(S.t * 40) > 0);
  m.muzzle.intensity = Math.max(0, m.muzzle.intensity - dt * 25);
  m.pistol.position.z = lerp(m.pistol.position.z, 0.72, dt * 18);
  // enemies
  for (const e of [...enemies]) {
    if (e.boss) updBoss(e, dt); else updEnemy(e, dt);
    e.flash -= dt; e.pt.hull.emissive.setHex(e.flash > 0 ? 0xffffff : 0x000000);
    if (!e.def.fly) e.pos.y = 0;
  }
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j], dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), m2 = a.r + b.r;
    if (d < m2 && d > 1e-4) { const push = (m2 - d) / 2; const wa = a.boss ? 0 : 1, wb = b.boss ? 0 : 1;
      a.pos.x -= dx / d * push * wa; a.pos.z -= dz / d * push * wa; b.pos.x += dx / d * push * wb; b.pos.z += dz / d * push * wb; }
  }
  updTelegraphs(dt); updBullets(dt); updOrbs(dt); updPickups(dt); updParts(dt);
  // waves
  if (S.scene === 'dungeon' && S.waveLive && S.pending === 0 && enemies.length === 0) { S.waveLive = false; after(1.6, nextWave); }
  // interactions
  let near = null;
  for (const it of interactables) if (Math.hypot(P.pos.x - it.x, P.pos.z - it.z) < it.r) { near = it; break; }
  const pr = $('#prompt');
  if (near) { pr.hidden = false; pr.innerHTML = `<kbd>E</kbd>${esc(near.label)}`; if (pressed.has('KeyE') || pressed.has('Enter') || (pad && pad.act)) { near.act(); } }
  else pr.hidden = true;
  // camera
  const dist = 6.2, cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
  camPos.set(P.pos.x - fx * dist * cp + rx * 0.9, 1.7 + sp * dist, P.pos.z - fz * dist * cp + rz * 0.9);
  if (S.scene === 'dungeon') { camPos.x = clamp(camPos.x, -23.5, 23.5); camPos.z = clamp(camPos.z, -23.5, 23.5); }
  camera.position.lerp(camPos, Math.min(1, dt * 14));
  camTarget.set(P.pos.x + fx * 4 + rx * 0.9, 1.6 + (0.4 - P.pitch) * 2, P.pos.z + fz * 4 + rz * 0.9);
  camera.lookAt(camTarget);
  if (S.shake > 0) { const k = S.shake * save.settings.shake * 0.4; camera.position.x += rand(-k, k); camera.position.y += rand(-k, k); S.shake = Math.max(0, S.shake - dt * 2.2); }
  sun.position.set(P.pos.x + 14, 30, P.pos.z + 10); sun.target.position.copy(P.pos);
  // hud
  hudTick -= dt; if (hudTick <= 0) { hudTick = 0.08; updateHud(); }
  autosave -= dt; if (autosave <= 0) { autosave = 10; persist(); }
}

// ---------------------------------------------------------------- BOOT
function start(data) {
  loadSave();
  if (data && data.save) mergeSave(data.save);
  buildTown();
  openTitle();
  frame();
}
try { window.claude?.hot?.snapshot?.(() => ({ save })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
addEventListener('beforeunload', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(); if (S.mode === 'play') openPause(); } });
</script>
