  showPanel(`<div class="card"><div class="eyebrow">${studio ? 'MVP Studios · your soundstage' : 'Desert Rose Motel · room 12'}</div><h2>${studio ? 'Studio floor' : 'Gig board'}</h2>
    ${studio ? `<div class="btns"><button class="btn primary" data-act="produce" ${canProduce ? '' : 'disabled'}><span>Produce a film<br><small>${!save.roster.length ? 'Sign talent first' : save.lastProduce === save.day ? 'One production per day. Come back tomorrow' : 'Book talent, pick a set, call the shots'}</small></span></button>
      <button class="btn" data-act="roster">Talent roster & contracts</button></div>
      <p class="muted">Released films: ${save.releases.length}. Royalties: ${fmt(save.releases.reduce((s, r) => s + r.royalty, 0))} per day.</p><h3>Gigs</h3>` : ''}
    <div class="btns">${gigs}</div>
    <div class="btns"><button class="btn" data-act="save">Save game</button><button class="btn" data-act="close">Leave</button></div></div>`);
}
function openShop() {
  S.mode = 'menu';
  const rows = GEAR.map(g => { const lv = save.gear[g.id], cost = Math.round(g.base * Math.pow(1.8, lv)), max = lv >= g.max;
    return `<button class="btn" data-act="buy:${g.id}" ${max || save.cash < cost ? 'disabled' : ''}><span>${g.name} <small>Lv ${lv}/${g.max} · ${g.desc}</small></span><span class="money">${max ? 'Maxed' : fmt(cost)}</span></button>`; }).join('');
  showPanel(`<div class="card"><div class="eyebrow">Lens & Light · camera supply</div><h2>Dee's counter</h2>
    <div class="line"><span class="who">Dee</span><p>"Better glass, better money. Simple as that."</p></div>
    <p class="money">${fmt(save.cash)}</p><div class="btns">${rows}<button class="btn primary" data-act="close">Done</button></div></div>`);
}
function buyGear(id) {
  const g = GEAR.find(x => x.id === id), cost = Math.round(g.base * Math.pow(1.8, save.gear[id]));
  if (save.cash < cost || save.gear[id] >= g.max) return;
  save.cash -= cost; save.gear[id]++; sfx('cash'); persist(); openShop();
}
function openRoster() {
  const cards = Object.entries(TALENT).filter(([, t]) => !t.freelance).map(([id, t]) => {
    const signed = save.roster.includes(id), canSign = !signed && t.req > 0 && save.rep >= t.req && save.cash >= t.fee * 2;
    const status = signed ? 'Under contract' : t.req === 0 ? 'Meet her in the story' : save.rep < t.req ? `Needs ${t.req} rep` : `Signing bonus ${fmt(t.fee * 2)}`;
    return `<button class="btn ${signed ? 'sel' : ''}" data-act="sign:${id}" ${canSign ? '' : 'disabled'}><span class="nm">${esc(t.name)}</span>
      <small>${t.age} · ${esc(t.role)}</small><span class="stars">${'★'.repeat(t.star)}${'☆'.repeat(5 - t.star)}</span><small>${esc(t.bio)}</small><small>Day rate ${fmt(t.fee)} · likes ${t.light} light, ${t.mood} mood</small><small><b>${status}</b></small></button>`;
  }).join('');
  showPanel(`<div class="card wide"><div class="eyebrow">Talent roster</div><h2>Who works with MVP Media</h2>
    <p class="muted">Every performer is an adult professional with ID on file, signed terms, and a paid day rate. They pick their sets; you pick the light and the mood.</p>
    <div class="talent">${cards}</div><div class="btns"><button class="btn primary" data-act="base:STUDIO">Back</button></div></div>`);
}
function signTalent(id) { const t = TALENT[id]; if (save.cash < t.fee * 2 || save.rep < t.req) return; save.cash -= t.fee * 2; save.roster.push(id); sfx('cash'); toast('Signed', `${t.name} joins MVP Media`); persist(); openRoster(); }

// Production: book talent + set + budget, make three director calls, release.
let prod = null;
function openProduction(story) {
  S.mode = 'menu';
  prod = { story, cast: story ? ['jade'] : [], set: 'stage', budget: story ? 0 : 1, calls: {}, stage: 'setup' };
  renderProd();
}
function prodCost() { return (prod.story ? 0 : prod.cast.reduce((s, id) => s + TALENT[id].fee, 0)) + SETS[prod.set].cost + BUDGET[prod.budget].cost; }
function prodToggle(id) { const i = prod.cast.indexOf(id); if (i >= 0) prod.cast.splice(i, 1); else if (prod.cast.length < 2) prod.cast.push(id); renderProd(); }
function renderProd() {
  const cost = prodCost(), ok = prod.cast.length && save.cash >= cost;
  const cast = save.roster.map(id => { const t = TALENT[id]; return `<button class="btn ${prod.cast.includes(id) ? 'sel' : ''}" data-act="psel:${id}"><span>${esc(t.name)} <small>${'★'.repeat(t.star)}</small></span><small>${fmt(t.fee)}</small></button>`; }).join('');
  const sets = Object.entries(SETS).map(([k, s]) => `<button class="btn ${prod.set === k ? 'sel' : ''}" data-act="pset:${k}"><span>${s.name}</span><small>${s.cost ? fmt(s.cost) : 'Free'}</small></button>`).join('');
  const bud = BUDGET.map((b, i) => `<button class="btn ${prod.budget === i ? 'sel' : ''}" data-act="pbud:${i}"><span>${b.name} crew</span><small>${b.cost ? fmt(b.cost) : 'Free'}</small></button>`).join('');
  showPanel(`<div class="card wide"><div class="eyebrow">MVP Studios · pre-production</div><h2>${prod.story ? 'First feature' : 'New production'}</h2>
    <h3>Cast (up to 2)</h3><div class="row2">${cast}</div>
    <h3>Set</h3><div class="row2">${sets}</div>
    <h3>Crew budget</h3><div class="row2">${bud}</div>
    <p class="muted">${prod.story ? 'Jade is working this one for a share of the royalties, so there is no day rate. ' : ''}Closed set · IDs and contracts checked · intimacy coordinator on call.</p>
    <div class="btns"><button class="btn primary" data-act="proll" ${ok ? '' : 'disabled'}><span>Lights, camera, action</span><span class="money">${fmt(cost)}</span></button>
    ${prod.story ? '' : '<button class="btn" data-act="base:STUDIO">Cancel</button>'}</div>
    ${save.cash < cost ? `<p class="muted">You need ${fmt(cost - save.cash)} more.</p>` : ''}</div>`, !prod.story);
}
const CALLS = [['light', 'Lighting', ['warm', 'cool', 'neon']], ['mood', 'Mood', ['playful', 'romantic', 'dramatic']], ['cam', 'Camera', ['handheld', 'dolly', 'locked-off']]];
function prodRoll() { save.cash -= prodCost(); prod.stage = 0; sfx('cash'); renderCall(); }
function renderCall() {
  const [key, label, opts] = CALLS[prod.stage];
  const hint = prod.cast.map(id => TALENT[id]).map(t => key === 'light' ? `${t.name.split(' ')[0]} looks best in ${t.light} light.` : key === 'mood' ? `${t.name.split(' ')[0]} is feeling ${t.mood} today.` : '').filter(Boolean).join(' ');
  showPanel(`<div class="card"><div class="eyebrow">On set · ${SETS[prod.set].name}</div><div class="clap">Scene 1 · Take ${prod.stage + 1}</div>
    <h3>Director's call: ${label}</h3><p class="muted">${esc(hint || 'Your call, director.')}</p>
    <div class="row2">${opts.map(o => `<button class="btn" data-act="pcall:${o}">${o[0].toUpperCase() + o.slice(1)}</button>`).join('')}</div></div>`, false);
}
function prodCall(o) {
  prod.calls[CALLS[prod.stage][0]] = o; prod.stage++;
  if (prod.stage < CALLS.length) return renderCall();
  // score
  const cast = prod.cast.map(id => TALENT[id]);
  let q = cast.reduce((s, t) => s + t.star * 12, 0) / cast.length + (cast.length === 2 ? 8 : 0) + SETS[prod.set].q + save.gear.light * 5;
  for (const t of cast) { if (t.light === prod.calls.light) q += 7; if (t.mood === prod.calls.mood) q += 7; }
  q += prod.calls.cam === 'dolly' ? 5 : prod.calls.cam === 'handheld' ? 3 : 1;
  q = Math.round(clamp(q * BUDGET[prod.budget].m, 10, 100));
  const gross = Math.round(q * (25 + save.rep) * 2.2), royalty = Math.round(gross * 0.08);
  const titles = ['Neon Confessions', 'After Hours', 'Red Room', 'Desert Heat', 'Velvet Rope', 'High Roller', 'Last Call', 'Room 12', 'Midnight on Fremont', 'Double Down'];
  prod.result = { q, gross, royalty, title: titles[(save.releases.length + Math.floor(rand(0, 3))) % titles.length] + (save.releases.length >= titles.length ? ' ' + (save.releases.length + 1) : '') };
  showPanel(`<div class="card"><div class="eyebrow">Wrap</div><div class="clap">"Cut! That's a wrap."</div>
    <p>Everyone hits their marks, the crew breaks down the lights, and the talent gets paid before they leave the lot.</p>
    <h3>Edit bay</h3><h2>${esc(prod.result.title)}</h2>
    <p>Quality <b>${q}</b> / 100 · Opening sales <span class="money">${fmt(gross)}</span> · Royalties <span class="money">${fmt(royalty)}</span> per day</p>
    <div class="btns"><button class="btn primary" data-act="prelease">Release it</button></div></div>`, false);
}
function prodRelease() {
  const r = prod.result; save.cash += r.gross; save.releases.push({ title: r.title, royalty: r.royalty, q: r.q }); save.lastProduce = save.day;
  addRep(r.q >= 70 ? 5 : 2); sfx('win'); persist();
  const story = prod.story; prod = null; closePanel();
  toast('Released', `${r.title} is out. ${fmt(r.gross)} in opening sales.`);
  if (story) nextStep();
}
function openEnding() {
  S.mode = 'menu';
  showPanel(`<div class="card"><div class="logo"><div class="mvp">MVP</div><div class="media">MEDIA</div><div class="tag">Beyond the frame</div></div>
    <p style="text-align:center">From room 12 at the Desert Rose to the biggest name in Las Vegas nightlife media. The story is complete, but the city keeps going: gigs, films, and royalties are still on the table.</p>
    <p class="muted" style="text-align:center">${save.releases.length} films · ${save.shots} photos · ${fmt(save.cash)} in the bank</p>
    <div class="btns"><button class="btn primary" data-act="close">Keep playing</button></div></div>`);
}
function toast(title, text) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<b>${esc(title)}</b>${esc(text)}`; $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}
function begin(isNew) {
  S.act = null; target = null;
  closePanel(); S.mode = 'play'; placeStart(); persist();
  if (isNew) { setTimeout(() => toast('Phone', 'Missed call from Tony Velvet. Walk to the gold marker at the motel.'), 600); }
}

// ------------------------------------------------------------ LOOP
let last = performance.now(), autosave = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.mode === 'play') { update(dt); autosave += dt; if (autosave > 15) { autosave = 0; persist(); } }
  if (S.mode === 'shoot') { updShoot(dt); renderShoot(); }
  else { if (S.mode === 'title') { S.t += dt; S.camX = lerp(S.camX, 44 * TS + Math.sin(S.t * 0.05) * 1500, 0.02); S.camY = 40 * TS + Math.cos(S.t * 0.04) * 900; S.zoom = 0.7; updTraffic(dt); const ref = { x: S.camX, y: S.camY }; if (traffic.length < 30) { const c = spawnTrafficCar(ref); if (c) traffic.push(c); } traffic = traffic.filter(c => Math.hypot(c.x - ref.x, c.y - ref.y) < 1800); }
    render(); if (S.mode === 'title') { ctx.fillStyle = 'rgba(11,5,7,.35)'; ctx.fillRect(0, 0, W, H); } }
  pressed.clear(); mouse.clicked = false;
}
loadSave(); placeStart(); S.camX = 44 * TS; S.camY = 40 * TS;
openTitle();
requestAnimationFrame(frame);
addEventListener('beforeunload', () => { if (save.started) persist(); });
</script>
